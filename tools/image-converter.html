  <script>let file;
setupDrop("drop","inp",f=>{file=f[0];document.getElementById("goBtn").disabled=false});
async function go(){if(!file)return;const img=await loadImage(file);const c=document.createElement("canvas");c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);const fmt=document.getElementById("fmt").value;const ext=fmt.split("/")[1];c.toBlob(b=>{document.getElementById("result").innerHTML="<p class=\"info\">Converted to "+ext.toUpperCase()+" ("+formatSize(b.size)+")</p><button class=\"btn\" onclick=\"download(window._b,'converted."+ext+"')\">Download</button>";window._b=b},fmt,.92)}</script>
