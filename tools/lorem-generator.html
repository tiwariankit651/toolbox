  <script>
const W="lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum".split(" ");
function rw(){return W[Math.floor(Math.random()*W.length)]}
function sent(){const l=8+Math.floor(Math.random()*12);let s=rw();s=s[0].toUpperCase()+s.slice(1);for(let i=1;i<l;i++)s+=" "+rw();return s+"."}
function para(){const n=4+Math.floor(Math.random()*4);return Array.from({length:n},sent).join(" ")}
function gen(){
  const c=+document.getElementById("count").value;
  const t=document.getElementById("type").value;
  let out;
  if(t==="paragraphs")out=Array.from({length:c},para).join("\n\n");
  else if(t==="sentences")out=Array.from({length:c},sent).join(" ");
  else out=Array.from({length:c},rw).join(" ");
  document.getElementById("out").textContent=out;
}
gen();
  </script>
