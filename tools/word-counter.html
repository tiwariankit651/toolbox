<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Counter & Readability Analyzer | ToolBox</title>
  <meta name="description" content="Count words, characters, sentences, paragraphs. Check reading time and readability score. Free for students and writers.">
  <link rel="canonical" href="https://yourdomain.com/tools/word-counter.html">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
</head>
<body>
  <nav><a href="../" class="logo">🧰 ToolBox</a><div class="tagline">Free tools. No signup. No uploads.</div><button id="themeToggle" onclick="toggleTheme()">🌙</button></nav>
  <div class="container">
    <div class="breadcrumb"><a href="../">Home</a> → 📊 Word Counter</div>
    <div class="ad-slot"><span>Ad Space — Top</span></div>
    <div class="tool-section">
      <h1>📊 Word Counter & Readability</h1>
      <p class="info">Paste or type text to get word count, character count, reading time and readability score.</p>
      <textarea id="txt" placeholder="Type or paste your text here..." oninput="analyze()" style="min-height:200px"></textarea>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.8rem;margin:1rem 0" id="stats"></div>
    </div>
    <div class="ad-slot"><span>Ad Space — Bottom</span></div>
  </div>
  <footer>
    <div class="footer-brand"><svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#4f8cff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="40" height="40" rx="10" fill="url(#g)"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">AT</text></svg><span>Ankit Tiwari</span></div>
    <p>🧰 ToolBox</p><p><a href="../">Home</a> | <a href="../privacy.html">Privacy</a> | <a href="../contact.html">Contact</a></p><p style="margin-top:.5rem">© 2026 Ankit Tiwari</p>
  </footer>
  <script src="../js/common.js"></script>
  <script>
function analyze(){
  const t=document.getElementById("txt").value;
  const words=t.trim()?t.trim().split(/\s+/).length:0;
  const chars=t.length;
  const charsNoSpace=t.replace(/\s/g,'').length;
  const sentences=(t.match(/[.!?]+/g)||[]).length||0;
  const paragraphs=t.trim()?t.trim().split(/\n\s*\n/).length:0;
  const readMin=Math.ceil(words/200);
  const syllables=t.trim().split(/\s+/).reduce((a,w)=>{const m=w.toLowerCase().replace(/[^a-z]/g,'').match(/[aeiouy]+/g);return a+(m?m.length:1)},0);
  const flesch=words>0?Math.round(206.835-1.015*(words/(sentences||1))-84.6*(syllables/words)):0;
  const s=document.getElementById("stats");
  const card=(l,v)=>"<div style='background:var(--card);padding:1rem;border-radius:12px;text-align:center'><div style='font-size:1.5rem;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent'>"+v+"</div><div class='info'>"+l+"</div></div>";
  s.innerHTML=card("Words",words)+card("Characters",chars)+card("No Spaces",charsNoSpace)+card("Sentences",sentences)+card("Paragraphs",paragraphs)+card("Read Time",readMin+" min")+card("Readability",flesch>60?"Easy":flesch>30?"Medium":"Hard");
}
analyze();
  </script>
</body>
</html>
