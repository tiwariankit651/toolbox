  <script>function upd(){const hex=document.getElementById("ci").value;document.getElementById("cd").style.background=hex;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);const mx=Math.max(r,g,b)/255,mn=Math.min(r,g,b)/255,l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r/255)h=((g/255-b/255)/d+(g<b?6:0))*60;else if(mx===g/255)h=((b/255-r/255)/d+2)*60;else h=((r/255-g/255)/d+4)*60}document.getElementById("cv").innerHTML="HEX: "+hex+" | RGB: rgb("+r+","+g+","+b+") | HSL: hsl("+Math.round(h)+","+Math.round(s*100)+"%,"+Math.round(l*100)+"%)<button class=\"copy-btn\" onclick=\"copyText('"+hex+"')\">Copy</button>";const p=document.getElementById("pal");p.innerHTML="";for(let i=-2;i<=2;i++){const lA=Math.min(100,Math.max(0,Math.round(l*100)+i*15));p.innerHTML+="<div style=\"background:hsl("+Math.round(h)+","+Math.round(s*100)+"%,"+lA+"%);height:50px;border-radius:8px;flex:1;cursor:pointer\" onclick=\"copyText(this.style.background)\"></div>"}}
function parse(){const v=document.getElementById("ct").value.trim();const d=document.createElement("div");d.style.color=v;document.body.appendChild(d);const c=getComputedStyle(d).color;document.body.removeChild(d);const m=c.match(/\d+/g);if(m){document.getElementById("ci").value="#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join("");upd()}}
upd()</script>
